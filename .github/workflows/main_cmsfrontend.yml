name: Build and deploy to Azure Web App - CMSFrontend

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20.x'

      # 1. Install EVERYTHING (including Vite and TypeScript) to build the app
      - name: Install Build Dependencies
        run: npm install

      # 2. Run the build command (creates the 'dist' folder)
      - name: Build React App
        run: npm run build

      # 3. CRITICAL: Clean up dev dependencies to keep the deployment small.
      # This removes Vite, TypeScript, etc., but keeps Express for server.cjs
      - name: Install Production Dependencies
        run: |
          rm -rf node_modules
          npm install --production

      # 4. Deploy the root folder (contains dist, server.cjs, package.json, and node_modules)
      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'CMSFrontend'
          slot-name: 'Production'
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_419FE168126C459BA8748B55474CB491 }}
          package: .
