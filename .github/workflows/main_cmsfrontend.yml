name: Build and deploy to Azure Web App - CMSFrontend

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20.x' # 20 is the current LTS, very stable for Azure

      # 1. Install ALL dependencies (including dev tools like Vite/Tailwind)
      - name: Install Dependencies
        run: npm install

      # 2. Build the React application (creates the 'dist' folder)
      - name: Build Project
        run: npm run build

      # 3. Clean up: Remove dev dependencies to keep the deployment small
      # We also force install 'serve' here just in case you forgot to add it to package.json
      - name: Prepare Production Artifacts
        run: |
          rm -rf node_modules
          npm install --omit=dev
          npm install serve 

      # 4. Deploy everything remaining in the folder (dist + node_modules + package.json)
      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'CMSFrontend'
          slot-name: 'Production'
          package: . 
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_419FE168126C459BA8748B55474CB491 }}
